<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>模板详情 - 全域AI提示词</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .detail-content {
      background: var(--bg-global);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.8;
      white-space: pre-wrap;
      font-family: inherit;
      min-height: 120px;
      position: relative;
      border: 1.5px solid var(--border);
    }
    .detail-content.locked {
      filter: blur(4px);
      user-select: none;
      pointer-events: none;
    }
    .lock-overlay {
      background: rgba(255,240,243,0.9);
      border: 1.5px solid var(--border-pink);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }
    .lock-overlay-icon {
      width: 40px; height: 40px;
      stroke: var(--primary); fill: none; stroke-width: 1.8;
      margin-bottom: 10px;
    }
    .ph-chip {
      display: inline-flex;
      align-items: center;
      background: var(--bg-rose);
      border: 1px solid var(--border-pink);
      color: var(--primary-dark);
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 20px;
      margin: 4px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 600;
    }
    .ph-chip:active { background: var(--primary); color: #fff; transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="navbar-back" id="backBtn">
      <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="navbar-title" id="detailTitle">模板详情</div>
    <div class="navbar-action" id="collectBtn" title="收藏">
      <svg class="nav-icon" id="collectIcon" viewBox="0 0 24 24">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </div>
  </div>

  <div class="page-content-no-tab">
    <div style="padding:16px">
      <!-- 标签徽章 -->
      <div id="badgeWrap" style="display:flex;gap:8px;margin-bottom:12px"></div>

      <!-- 适用场景 -->
      <div style="font-size:14px;color:var(--text-hint);margin-bottom:12px;line-height:1.6" id="sceneText"></div>

      <!-- 标签 -->
      <div class="tag-list" id="tagList" style="margin-bottom:14px"></div>

      <!-- 内容区 -->
      <div style="font-size:13px;font-weight:700;color:var(--text-hint);margin-bottom:6px">提示词内容</div>
      <div class="detail-content" id="contentArea"></div>

      <!-- 锁定遮罩 -->
      <div id="lockOverlay" class="lock-overlay" style="display:none;margin-top:12px">
        <svg class="lock-overlay-icon" viewBox="0 0 24 24" style="display:block;margin:0 auto 10px">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <div style="font-size:15px;font-weight:700;color:var(--text-main);margin-bottom:6px">会员专享内容</div>
        <div style="font-size:13px;color:var(--text-hint);margin-bottom:14px">开通会员后可查看并复制完整提示词</div>
        <button class="btn btn-primary btn-block" onclick="APP.navigate('vip.html')">开通会员 · 首月¥3.9</button>
      </div>

      <!-- 占位符替换 -->
      <div id="phSection" style="display:none;margin-top:14px">
        <div style="font-size:13px;font-weight:700;color:var(--text-hint);margin-bottom:8px">
          快速填写占位符
        </div>
        <div id="phList"></div>
      </div>

      <!-- 操作按钮区 -->
      <div id="actionWrap" style="margin-top:16px;display:none">
        <div style="display:flex;gap:10px;margin-bottom:10px">
          <button class="btn btn-primary" style="flex:1" onclick="copyDetail()">
            <svg style="width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            一键复制
          </button>
          <button class="btn btn-outline" style="flex:1" onclick="sendToEditor()">
            <svg style="width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
            </svg>
            发送编辑器
          </button>
        </div>
        <button class="btn btn-outline btn-block" onclick="sendToPolish()">
          <svg style="width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24">
            <path d="M12 2L9 9H2l6 4.5-2.5 7.5L12 16.5 18.5 21 16 13.5 22 9h-7z"/>
          </svg>
          发送 AI 润色
        </button>
      </div>

      <!-- 使用统计 -->
      <div style="display:flex;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text-hint);display:flex;align-items:center;gap:5px">
          <svg style="width:14px;height:14px;stroke:var(--text-hint);fill:none;stroke-width:2" viewBox="0 0 24 24">
            <path d="M9 9a3 3 0 1 1 6 0 3 3 0 0 1-6 0M17.5 21c-.56-3.1-2.97-5-5.5-5s-4.94 1.9-5.5 5"/>
          </svg>
          <span id="useCountText"></span>次使用
        </span>
        <span style="font-size:13px;color:var(--text-hint);display:flex;align-items:center;gap:5px">
          <svg style="width:14px;height:14px;stroke:var(--text-hint);fill:none;stroke-width:2" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span id="likesText"></span>人喜欢
        </span>
      </div>
    </div>

    <!-- 合规底部 -->
    <div class="compliance-footer">
      <a href="privacy.html">《隐私政策》</a>
      <a href="disclaimer.html">《免责声明》</a>
      <a href="rules.html">《使用规则》</a>
    </div>
  </div>

  <script src="../data/templates.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let currentTemplate = null;
    let placeholders = [];
    let phValues = {};

    document.addEventListener('DOMContentLoaded', () => {
      initBackBtn();
      const id = parseInt(APP.getParam('id'));
      if (!id) { APP.toast('模板不存在'); history.back(); return; }

      currentTemplate = TEMPLATE_DB.templates.find(t => t.id === id);
      if (!currentTemplate) { APP.toast('模板不存在'); history.back(); return; }

      renderDetail();
      APP.history.add(currentTemplate.id, currentTemplate.title);

      // 收藏按钮
      const collectBtn = document.getElementById('collectBtn');
      updateCollectIcon();
      collectBtn.addEventListener('click', () => {
        const isNow = APP.collections.toggle(currentTemplate.id);
        updateCollectIcon();
        APP.toast(isNow ? '已加入收藏' : '已取消收藏');
      });
    });

    function updateCollectIcon() {
      const isCol = APP.collections.has(currentTemplate.id);
      const icon = document.getElementById('collectIcon');
      icon.style.stroke = isCol ? 'var(--primary)' : 'currentColor';
      icon.style.fill = isCol ? 'var(--primary)' : 'none';
    }

    function renderDetail() {
      const t = currentTemplate;
      const isMember = APP.member.isActive();
      const canView = t.isFree || isMember;

      document.getElementById('detailTitle').textContent = t.title;
      document.getElementById('sceneText').textContent = t.scene;
      document.getElementById('useCountText').textContent = formatNum(t.useCount);
      document.getElementById('likesText').textContent = formatNum(t.likes);

      // 徽章
      document.getElementById('badgeWrap').innerHTML = (t.isPremium
        ? '<span class="badge badge-premium">会员专享</span>'
        : '<span class="badge badge-free">免费</span>') +
        (t.isHot ? '<span class="badge badge-hot">热门</span>' : '');

      // 标签
      document.getElementById('tagList').innerHTML = (t.tags || []).map(tag =>
        `<span class="tag">#${escHtml(tag)}</span>`).join('');

      // 内容区
      const contentArea = document.getElementById('contentArea');
      const lockOverlay = document.getElementById('lockOverlay');

      if (canView) {
        contentArea.textContent = t.content;
        contentArea.classList.remove('locked');
        lockOverlay.style.display = 'none';
        document.getElementById('actionWrap').style.display = '';

        // 解析占位符 {{xxx}}
        const matches = [...new Set([...t.content.matchAll(/\{\{([^}]+)\}\}/g)].map(m => m[1]))];
        placeholders = matches;
        if (matches.length > 0) {
          document.getElementById('phSection').style.display = '';
          renderPlaceholders();
        }
      } else {
        // 付费内容：显示前40字并模糊
        contentArea.textContent = t.content.substring(0, 40) + '……（会员专享内容）';
        contentArea.classList.add('locked');
        lockOverlay.style.display = '';
        document.getElementById('actionWrap').style.display = 'none';
        document.getElementById('phSection').style.display = 'none';
      }
    }

    function renderPlaceholders() {
      const list = document.getElementById('phList');
      list.innerHTML = placeholders.map(ph => `
        <div style="margin-bottom:10px">
          <div style="font-size:12px;color:var(--text-hint);margin-bottom:4px">{{${escHtml(ph)}}}</div>
          <input type="text" 
            style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color 0.2s;font-family:inherit"
            placeholder="请输入${escHtml(ph)}"
            oninput="updatePH('${ph}', this.value)"
            onfocus="this.style.borderColor='var(--primary-light)'"
            onblur="this.style.borderColor='var(--border)'">
        </div>
      `).join('');
    }

    function updatePH(name, value) {
      phValues[name] = value;
    }

    function getFinalContent() {
      let content = currentTemplate.content;
      for (const [k, v] of Object.entries(phValues)) {
        if (v) content = content.replaceAll('{{' + k + '}}', v);
      }
      return content;
    }

    async function copyDetail() {
      const content = getFinalContent();
      const ok = await APP.copyText(content);
      if (ok) {
        APP.toastSuccess('已复制到剪贴板');
        APP.stats.recordCopy();
        currentTemplate.useCount++;
        document.getElementById('useCountText').textContent = formatNum(currentTemplate.useCount);
      } else {
        APP.toast('复制失败，请长按文字手动复制');
      }
    }

    function sendToEditor() {
      localStorage.setItem('editor_import', getFinalContent());
      APP.navigate('editor.html');
    }

    function sendToPolish() {
      localStorage.setItem('polish_import', getFinalContent());
      APP.navigate('polish.html');
    }
  </script>
</body>
</html>
